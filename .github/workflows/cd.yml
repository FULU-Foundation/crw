name: CD

on:
  push:
    branches: ['main', 'release']
    
env:
  IMAGE: ghcr.io/fulu-foundation/crw
  IMGGUARD_IMAGE: ghcr.io/fulu-foundation/crw-imgguard
  
jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Checkout the repo 
        uses: actions/checkout@v5
        with:
            submodules: recursive
        
      - name: Build container image
        run: |
          docker build -t $IMAGE:${GITHUB_REF_NAME}-${{ github.run_number }} -t $IMAGE:${GITHUB_REF_NAME} .
      - name: Push
        run: |
          docker push $IMAGE:${GITHUB_REF_NAME}
          docker push $IMAGE:${GITHUB_REF_NAME}-${{ github.run_number }}

  build_and_push_imgguard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Checkout the repo
        uses: actions/checkout@v5

      - name: Build content scanner image
        run: |
          docker build -f imgguard/docker/Dockerfile \
            -t $IMGGUARD_IMAGE:${GITHUB_REF_NAME}-${{ github.run_number }} \
            -t $IMGGUARD_IMAGE:${GITHUB_REF_NAME} \
            imgguard

      - name: Push
        run: |
          docker push $IMGGUARD_IMAGE:${GITHUB_REF_NAME}
          docker push $IMGGUARD_IMAGE:${GITHUB_REF_NAME}-${{ github.run_number }}
