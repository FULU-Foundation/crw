name: CD

on:
  push:
    branches: ['main', 'release']

env:
  IMAGE: ghcr.io/fulu-foundation/crw

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Use the GitHub mirror for VisualEditor
        run: git config --global url."https://github.com/wikimedia/VisualEditor.git".insteadOf "https://gerrit.wikimedia.org/r/VisualEditor/VisualEditor.git"

      - name: Checkout the repo
        uses: actions/checkout@v5
        with:
            submodules: recursive

      - name: Build container image
        run: |
          docker build -t $IMAGE:${GITHUB_REF_NAME}-${{ github.run_number }} -t $IMAGE:${GITHUB_REF_NAME} .
      - name: Push
        run: |
          docker push $IMAGE:${GITHUB_REF_NAME}
          docker push $IMAGE:${GITHUB_REF_NAME}-${{ github.run_number }}
